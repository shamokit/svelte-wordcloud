packages:
  - 'packages/*'
  - 'playground'
  - 'docs'

overrides:
  svelte2tsx: ^0.7.55
  esbuild: ^0.28.1
  vite@>=7.0.0 <8.0.0: ^7.3.5
  path-to-regexp: ^6.3.0
  tar: ^7.5.16
  js-yaml: ^4.2.0

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
